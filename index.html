<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Tissue Interaction Simulator</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <canvas id="simCanvas" width="700" height="700"></canvas>

    <div id="panel">
      <h3>Cell Types</h3>
      <select id="cellType" multiple size="10"></select>

      <div id="desc">Hover over a cell to see description</div>

      <h3>Parameters</h3>
      <label>Diffusion <input id="diffusion" type="range" min="0" max="1" step="0.01" value="0.2"></label>
      <label>Decay <input id="decay" type="range" min="0" max="0.1" step="0.001" value="0.01"></label>

      <button id="toggle">Pause</button>
      <button id="reset">Reset</button>
    </div>
  </div>

  <script src="cells.js"></script>
  <script src="simulation.js"></script>
  <script src="ui.js"></script>
</body>
</html>
